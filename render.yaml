services:
  - type: web
    name: rollforward-engine
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/ReaperXD67/rollforward-optimistic-engine
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 20
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCENARIO_MAX_ENTRIES
        value: 256
      - key: SCENARIO_TTL_MS
        value: 1800000
